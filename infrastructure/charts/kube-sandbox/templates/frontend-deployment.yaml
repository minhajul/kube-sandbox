{{- if .Values.apps.frontend.enabled -}}
{{- $ctx := . -}}
{{- $app := .Values.apps.frontend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-sandbox.appFullname" (dict "ctx" $ctx "appName" "frontend") }}
  labels:
    {{- include "kube-sandbox.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ $app.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-sandbox.appSelectorLabels" (dict "ctx" $ctx "appName" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-sandbox.appSelectorLabels" (dict "ctx" $ctx "appName" "frontend") | nindent 8 }}
      {{- with $ctx.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $ctx.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "kube-sandbox.image" (dict "ctx" $ctx "appName" "frontend") }}
          imagePullPolicy: {{ $app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
              protocol: TCP
          # Frontend is the only app that talks to the backends.
          # Service URLs are computed via the helper so they stay correct
          # even if the app fullname convention changes.
          env:
            - name: NODE_ENV
              value: {{ $app.env.NODE_ENV | default "production" | quote }}
            - name: PORT
              value: {{ $app.port | quote }}
            - name: AUTH_SERVICE_URL
              value: {{ include "kube-sandbox.serviceURL" (dict "ctx" $ctx "appName" "auth" "port" $.Values.apps.auth.port) | quote }}
            - name: PROFILE_SERVICE_URL
              value: {{ include "kube-sandbox.serviceURL" (dict "ctx" $ctx "appName" "profile" "port" $.Values.apps.profile.port) | quote }}
          {{- if $app.healthcheckPath }}
          readinessProbe:
            httpGet:
              path: {{ $app.healthcheckPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $app.healthcheckPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          {{- with $ctx.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-sandbox.appFullname" (dict "ctx" $ctx "appName" "frontend") }}
  labels:
    {{- include "kube-sandbox.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "kube-sandbox.appSelectorLabels" (dict "ctx" $ctx "appName" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
      protocol: TCP
{{- end }}

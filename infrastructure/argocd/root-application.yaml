apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argocd
  labels:
    app.kubernetes.io/name: root-application
spec:
  project: default
  source:
    # Update this to point at your actual Git repo
    repoURL: https://github.com/minhajul/kube-sandbox.git
    targetRevision: HEAD
    path: infrastructure/apps
    directory:
      # Recurse picks up auth-service.yaml, profile-service.yaml, frontend.yaml
      recurse: true
      include: '{*.yaml,*.yml}'
      # Exclude the ingress so it is managed outside the apps loop if desired
      exclude: '{ingress.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

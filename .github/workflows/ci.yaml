# ============================================================================
# kube-sandbox — CI workflow (build & push images to GHCR)
# ----------------------------------------------------------------------------
# Triggers:
#   - pull_request: lint + build images (do NOT push) so PRs are validated fast
#   - push to main: lint + build + push images to ghcr.io/<owner>/<service>
#
# Why two jobs:
#   - `lint`  — cheap checks (helm/kubeconform) run on every PR
#   - `build` — only on push to main; gated on lint passing
#
# Image promotion (the "CD" half) lives in `promote.yaml` and is added later.
# This file only proves the registry/auth wiring works end-to-end.
# ============================================================================

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight run when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default least-privilege; jobs escalate via their own `permissions:` block.
permissions: {}

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint job — cheap, runs on every PR and every push to main
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.1   # match the version used locally (see IMPLEMENTATION.md)

      - name: Install kubeconform
        run: |
          # Pull the kubeconform binary out of its official image instead of
          # using `uses: docker://ghcr.io/yannh/kubeconform:latest` (which
          # runs the image as a container action but doesn't expose the
          # binary on PATH).
          set -euo pipefail
          curl -sSL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-$(uname -s)-$(uname -m).tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Helm lint + render + kubeconform
        run: |
          # Render the chart to stdout, pipe to kubeconform via stdin.
          # Catches schema bugs before they hit the cluster.
          helm template apps infrastructure/charts/kube-sandbox \
            --namespace default \
            | kubeconform -strict -summary -ignore-missing-schemas -

          # Also validate the ArgoCD Application manifests directly.
          kubeconform -strict -summary -ignore-missing-schemas \
            infrastructure/argocd/*.yaml

  # --------------------------------------------------------------------------
  # 2. Build job — matrix over the 3 services, push only on push-to-main
  # --------------------------------------------------------------------------
  build:
    name: Build & push (${{ matrix.service }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `packages: write` is the only elevated permission in this file.
    # Without it, `docker push` to ghcr.io fails with 403.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: backend/auth-service
            dockerfile: backend/auth-service/Dockerfile
          - service: profile-service
            context: backend/profile-service
            dockerfile: backend/profile-service/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only on push-to-main. PRs build but never push (see `push:` below
      # being conditional on `github.event_name == 'push'`).
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token — no secret needed for public repos. For private
          # repos, this still works, but package visibility defaults to private,
          # and you must grant read access per consumer.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}
          # Push short-sha always. Add `latest` only on push-to-main.
          # PRs build but never push (gated by `push:` below), so the
          # `latest` tag would only ever reach GHCR from a real merge.
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=kube-sandbox-${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # On PRs: build only (load into runner, never push).
          # On main: build + push to GHCR.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache per-service so frontend cache doesn't hit auth-service.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          # Single-arch only for now; add `platforms:` for multi-arch later.
          platforms: linux/amd64
          # Quiet — full SBOM/provenance lives in GHCR UI, not in logs.
          provenance: false
          sbom: false
